name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test -p baselines --no-default-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p baselines --all-features --no-deps
      - run: cargo publish -p baselines --dry-run

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm install --global wasm-pack@0.15.0
      - run: npm ci --prefix bindings/wasm
      - run: npm run --prefix bindings/wasm build
      - run: npm test --prefix bindings/wasm
      - run: npm run --prefix bindings/wasm typecheck
      - run: npm run --prefix bindings/wasm pack:check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo check -p baselines --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install "maturin>=1.9,<2"
      - run: maturin build --release --out dist
        working-directory: bindings/python
      - run: python -m pip install numpy bindings/python/dist/*.whl
      - run: python bindings/python/smoke.py
