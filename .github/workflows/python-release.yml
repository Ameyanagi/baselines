name: Publish Python package

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("bindings/python/pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "python-v${version}"

  linux:
    name: Linux ${{ matrix.target }} wheel
    needs: validate
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml
          manylinux: auto
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: python-dist-linux-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target }} wheel
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: python-dist-macos-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  windows:
    name: Windows x64 wheel
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --manifest-path bindings/python/Cargo.toml
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: python-dist-windows-x64
          path: dist
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path bindings/python/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: python-dist-sdist
          path: dist
          if-no-files-found: error

  smoke-test:
    name: Test Linux wheel
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-dist-linux-x86_64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install wheel
        run: python -m pip install numpy dist/*.whl
      - name: Exercise public API
        run: |
          python - <<'PY'
          import numpy as np
          import baselines_rs

          y = np.array([1.0, 1.1, 4.2, 1.2, 1.0])
          estimated = baselines_rs.baseline(y)
          corrected = baselines_rs.correct(y, method="arpls")
          assert estimated.shape == y.shape
          assert corrected.shape == y.shape
          assert np.isfinite(estimated).all()
          assert np.isfinite(corrected).all()
          assert "asls" in baselines_rs.methods()
          PY

  publish:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist, smoke-test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/baselines-rs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
