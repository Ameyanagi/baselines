name: Publish WASM package

on:
  push:
    tags:
      - "wasm-v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install release tooling
        run: npm install --global npm@11.16.0 wasm-pack@0.15.0
      - name: Install development dependencies
        run: npm ci --prefix bindings/wasm
      - name: Verify tag matches package versions
        shell: bash
        run: |
          npm_version="$(node -p 'require("./bindings/wasm/package.json").version')"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "baselines-rs") | .version')"
          test -n "${npm_version}"
          test "${npm_version}" = "${cargo_version}"
          test "${GITHUB_REF_NAME}" = "wasm-v${npm_version}"
      - name: Build npm package
        run: npm run --prefix bindings/wasm build
      - name: Test WASM runtime
        run: npm test --prefix bindings/wasm
      - name: Check TypeScript declarations
        run: npm run --prefix bindings/wasm typecheck
      - name: Inspect package contents
        run: npm pack bindings/wasm/pkg --dry-run
      - name: Publish package
        run: npm publish bindings/wasm/pkg --access public
